name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Derle
        run: |
          Z=$(git log --name-only --pretty=format: -- '*.zip' | sed '/^$/d' | head -n 1 || true)
          echo "Kullanılan zip: $Z"
          unzip -o -q "$Z" -d proje
          bash proje/derle.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: Duzeltici.apk
