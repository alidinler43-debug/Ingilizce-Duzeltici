name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Projeyi bul ve aç
        run: |
          echo "Depodaki dosyalar:"
          find . -path ./.git -prune -o -type f -print
          # En son yüklenen zip'i bul (adı ne olursa olsun)
          LISTE=$(git -c core.quotePath=false log --name-only --pretty=format: -- '*.zip' '*.ZIP' 2>/dev/null || true)
          ZIP=""
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then ZIP="$f"; break; fi
          done <<< "$LISTE"
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -path ./.git -prune -o -type f -iname "*.zip" -print | head -n 1 || true)
          fi
          if [ -n "$ZIP" ]; then
            echo "Kullanılan zip: $ZIP"
            unzip -o -q "$ZIP" -d proje
          fi
          AYAR=$(find proje -name settings.gradle 2>/dev/null | head -n 1 || true)
          if [ -z "$AYAR" ]; then
            AYAR=$(find . -path ./.git -prune -o -name setti
